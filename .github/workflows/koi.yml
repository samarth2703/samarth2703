- name: git-profile-koi
  # You may pin to the exact commit or the version.
  # uses: yalongwastaken/git-koi@8a4fb8e69727b905160f27cf11593fb717fa4347
  uses: yalongwastaken/git-koi@v1.0.1
  with:
    # Account whose koi to draw.
    login: # optional, default is ${{ github.repository_owner }}
    # Body color, one of white, black, asagi, tea, gold, or platinum.
    body: # optional, default is white
    # Folder, relative to the workspace, that receives koi.gif, koi.png, and preview.html.
    output-dir: # optional, default is koi
    # Token for reading the account's public data; the built-in token is enough.
    token: # optional, default is ${{ github.token }}
