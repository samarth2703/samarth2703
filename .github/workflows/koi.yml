
name: Git Profile Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

concurrency:
  group: git-profile-koi
  cancel-in-progress: false

jobs:
  generate-koi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1.0.1
        with:
          login: samarth2703
          body: white
          output-dir: koi
          token: ${{ github.token }}

      - name: Commit generated Koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Git Profile Koi"
            git push
          fi
